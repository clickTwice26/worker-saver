# worker-saver.shagato.space
#
# Single upstream: the Node process serves both the built frontend and /api, so
# there is no root/alias to keep in step with a deploy and nothing to change
# when the app is rebuilt.
#
# Install:
#   sudo cp ~/apps/worker-saver/deploy/nginx.conf /etc/nginx/sites-available/worker-saver.shagato.space
#   sudo ln -s /etc/nginx/sites-available/worker-saver.shagato.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d worker-saver.shagato.space
#
# Certbot rewrites this file to add the TLS block and the 80->443 redirect,
# matching the other sites on this host.

server {
    listen 80;
    listen [::]:80;
    server_name worker-saver.shagato.space;

    # CSV imports are posted as JSON; large files are read server-side from
    # ALE_DATASETS_DIR instead, but a hand-uploaded roster still needs headroom.
    client_max_body_size 32m;

    location / {
        proxy_pass         http://127.0.0.1:28710;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        # Importing a large dataset and training a model both run well past the
        # 60s default; a 1M-row import takes about a minute.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
